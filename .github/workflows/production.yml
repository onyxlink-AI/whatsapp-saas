name: Publicar producción con aprobación

on:
  workflow_dispatch:
    inputs:
      sha:
        description: SHA completo ya validado en staging
        required: true
      confirmation:
        description: Escribe PUBLICAR para autorizar
        required: true

concurrency:
  group: onyxlink-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Verificar autorización y candidato
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.value }}
    steps:
      - name: Exigir confirmación literal
        if: inputs.confirmation != 'PUBLICAR'
        run: |
          echo "Confirmación inválida. No se toca producción."
          exit 1

      - name: Descargar main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Confirmar que el SHA pertenece a main y es su HEAD
        id: sha
        shell: bash
        run: |
          requested="${{ inputs.sha }}"
          head_sha="$(git rev-parse origin/main)"
          test "$requested" = "$head_sha"
          echo "value=$head_sha" >> "$GITHUB_OUTPUT"

  deploy:
    name: Migrar y desplegar
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Configurar este Environment en GitHub con un required reviewer.
    environment: production

    steps:
      - name: Descargar el SHA autorizado
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Instalar dependencias
        run: npm ci

      - name: Crear Supabase local efímero para las pruebas
        shell: bash
        run: |
          supabase start
          status="$(supabase status --output json)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r '.API_URL' <<<"$status")" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(jq -r '.ANON_KEY' <<<"$status")" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(jq -r '.SERVICE_ROLE_KEY' <<<"$status")" >> "$GITHUB_ENV"

      - name: Revalidar el candidato exacto
        env:
          NEXT_PUBLIC_APP_URL: https://onyxlinkpanel.com
          ENCRYPTION_KEY: ${{ secrets.PRODUCTION_ENCRYPTION_KEY }}
          ENCRYPTION_KEY_VERSION: ${{ secrets.PRODUCTION_ENCRYPTION_KEY_VERSION }}
        run: npm run validate

      - name: Detener Supabase local de pruebas
        run: supabase stop --no-backup

      - name: Comprobar backups físicos
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          result="$(supabase backups list --project-ref "${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}")"
          echo "$result" | jq -e '(.walg_enabled == true) and ([.backups[] | select(.status == "COMPLETED")] | length > 0)' > /dev/null

      - name: Preflight remoto de Board
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run preflight:board

      - name: Enlazar Supabase Production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}" --password "${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}"

      - name: Mostrar migraciones pendientes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase migration list --linked

      - name: Aplicar únicamente migraciones versionadas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked

      - name: Confirmar sincronización de migraciones
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase migration list --linked

      - name: Desplegar SHA exacto en Vercel Production
        id: deploy
        shell: bash
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install --global vercel@58.4.4
          url="$(vercel deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}" --scope "${{ secrets.VERCEL_ORG_ID }}" --meta gitCommitSha="${GITHUB_SHA}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Producción: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test público
        # onyxlinkpanel.com es el alias de producción: tras "vercel deploy
        # --prod" (paso anterior) apunta exactamente al deployment recién
        # publicado, así que estas comprobaciones ya validan ese candidato,
        # no uno anterior.
        shell: bash
        run: |
          curl --fail --show-error --silent --retry 5 --retry-delay 5 https://onyxlinkpanel.com/login > /dev/null
          code="$(curl --output /dev/null --silent --write-out '%{http_code}' https://onyxlinkpanel.com/dashboard)"
          test "$code" = "307"

          # Sin cookies ni cabecera de autorización: debe rechazarse con
          # exactamente 401 (nunca 404, nunca 500 de un grant roto, nunca una
          # redirección inesperada). Ver src/lib/auth/rls-helper-privileges.test.ts
          # para por qué este smoke test vive aquí y no en Vitest.
          configurator_code="$(curl --output /dev/null --silent --write-out '%{http_code}' https://onyxlinkpanel.com/api/workspace/00000000-0000-0000-0000-000000000000/office-virtual/configurator)"
          if [ "$configurator_code" != "401" ]; then
            echo "Esperaba HTTP 401 sin sesión en /api/workspace/.../office-virtual/configurator, recibido $configurator_code" >&2
            exit 1
          fi

      - name: Recordatorio de comprobación autenticada
        run: |
          echo "## Pendiente obligatorio" >> "$GITHUB_STEP_SUMMARY"
          echo "Realizar smoke test con sesión interna y observar Vercel/Supabase durante 15 minutos antes de ampliar feature flags." >> "$GITHUB_STEP_SUMMARY"

      - name: Detener Supabase local si un paso anterior falló
        if: always()
        run: supabase stop --no-backup || true
