name: Copia externa cifrada de producción

on:
  schedule:
    # 02:20 UTC. Permanece inactivo hasta BACKUP_ENABLED=true.
    - cron: "20 2 * * *"
  workflow_dispatch:

concurrency:
  group: onyxlink-backup-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    if: vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: backup-production

    steps:
      - name: Descargar scripts versionados
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Instalar rclone (version y checksum fijados)
        run: |
          set -euo pipefail
          version="v1.75.0"
          expected_sha256="aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa"
          zip="rclone-${version}-linux-amd64.zip"
          curl -fsSL -o "$zip" "https://downloads.rclone.org/${version}/${zip}"
          echo "${expected_sha256}  ${zip}" | sha256sum -c -
          unzip -q "$zip"
          sudo install -m 755 "rclone-${version}-linux-amd64/rclone" /usr/local/bin/rclone
          rm -rf "$zip" "rclone-${version}-linux-amd64"
          rclone version

      - name: Comprobar backup físico de Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          result="$(supabase --output json backups list --project-ref "${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}")"
          if ! jq -e '
            type == "object"
            and (.walg_enabled == true)
            and ([.backups[]? | select(.status == "COMPLETED")] | length > 0)
          ' <<< "$result" > /dev/null; then
            echo "Supabase no devolvió un backup físico COMPLETED en formato JSON válido." >&2
            exit 1
          fi

      - name: Crear snapshot externo cifrado e inmutable por ruta
        id: create
        env:
          BACKUP_RUN_ENABLED: "true"
          BACKUP_CONFIRMATION: ONYXLINK_BACKUP_PRODUCTION
          SUPABASE_DB_URL: ${{ secrets.PRODUCTION_SUPABASE_DB_URL }}
          SUPABASE_S3_ENDPOINT: ${{ secrets.PRODUCTION_SUPABASE_S3_ENDPOINT }}
          SUPABASE_S3_REGION: ${{ secrets.PRODUCTION_SUPABASE_S3_REGION }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.PRODUCTION_SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.PRODUCTION_SUPABASE_S3_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RCLONE_CRYPT_PASSWORD: ${{ secrets.RCLONE_CRYPT_PASSWORD }}
          RCLONE_CRYPT_PASSWORD2: ${{ secrets.RCLONE_CRYPT_PASSWORD2 }}
        run: npm run backup:create

      - name: Revalidar el snapshot desde cero
        env:
          BACKUP_SNAPSHOT_PATH: ${{ steps.create.outputs.snapshot_path }}
          SUPABASE_S3_ENDPOINT: ${{ secrets.PRODUCTION_SUPABASE_S3_ENDPOINT }}
          SUPABASE_S3_REGION: ${{ secrets.PRODUCTION_SUPABASE_S3_REGION }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.PRODUCTION_SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.PRODUCTION_SUPABASE_S3_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RCLONE_CRYPT_PASSWORD: ${{ secrets.RCLONE_CRYPT_PASSWORD }}
          RCLONE_CRYPT_PASSWORD2: ${{ secrets.RCLONE_CRYPT_PASSWORD2 }}
        run: npm run backup:verify

      - name: Informe sin datos sensibles
        run: |
          echo "## Copia externa completada" >> "$GITHUB_STEP_SUMMARY"
          echo "Snapshot: \`${{ steps.create.outputs.snapshot_path }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Objetos de Storage verificados: ${{ steps.create.outputs.storage_objects }}" >> "$GITHUB_STEP_SUMMARY"
          echo "No se ha publicado ningún artefacto en GitHub Actions." >> "$GITHUB_STEP_SUMMARY"

