name: Prueba sintética de backup (solo Linux)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-test-only:
    name: backup:test sintético
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el commit exacto
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Prueba sintética de backup (infraestructura falsa, sin credenciales reales)
        run: npm run backup:test
